[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/storage",
    "crates/audit",
    "crates/rules_engine",
    "crates/alerts",
    "crates/ingestion",
    "crates/ai_advisor",
    "crates/soroban_anchor",
    "crates/api",
]
# crates/soroban_anchor/contract is intentionally NOT a member: it's a Soroban
# contract with its own nested workspace (see that directory's Cargo.toml) so its
# wasm-specific release profile (panic=abort, lto, opt-level="z") never applies to
# the host application. Build/test it separately: `cd crates/soroban_anchor/contract`.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate"] }
rust_decimal = { version = "1", features = ["serde-str"] }

domain = { path = "crates/domain" }
storage = { path = "crates/storage" }
audit = { path = "crates/audit" }
rules_engine = { path = "crates/rules_engine" }
alerts = { path = "crates/alerts" }
ingestion = { path = "crates/ingestion" }
ai_advisor = { path = "crates/ai_advisor" }
soroban_anchor = { path = "crates/soroban_anchor" }

[profile.dev]
opt-level = 0
